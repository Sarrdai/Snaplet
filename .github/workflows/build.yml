name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Snaplet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snaplet-${{ github.run_number }}
          path: Snaplet.apk

      # Stable download link for the phone: the "latest" pre-release always holds the newest APK
      - name: Publish as latest release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Snaplet.apk --prerelease --target "$GITHUB_SHA" \
            --title "Snaplet (neuester Stand)" \
            --notes "Build ${{ github.run_number }} von ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Auf dem Handy herunterladen und installieren."
